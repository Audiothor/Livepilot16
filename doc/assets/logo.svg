<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="920" height="180">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00c8e0"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Emblem Icon -->
  <g transform="translate(14, 13)">
    <!-- Circular Cyan Arc -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#cyanGrad)" stroke-width="4.2" filter="url(#cyanGlow)"/>
    
    <!-- Left Parallel Silver Metallic Bars -->
    <rect x="19" y="16" width="4.2" height="32" rx="2.1" fill="url(#silverGrad)"/>
    <rect x="26.5" y="12" width="4.2" height="40" rx="2.1" fill="url(#silverGrad)"/>
    
    <!-- Play Triangle Arrow with flared ergonomic wing -->
    <path d="M 35 20 L 51 32 L 35 44 C 40 37 40 27 35 20 Z" fill="url(#cyanGrad)" filter="url(#cyanGlow)"/>
  </g>

  <!-- Typography -->
  <!-- LIVEPILOT in Bold Futuristic Metallic Sans -->
  <text x="96" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', 'Arial Black', sans-serif" font-size="39" font-weight="900" letter-spacing="2" fill="url(#silverGrad)">LIVEPILOT</text>
  
  <!-- 16 in Cyan Neon -->
  <text x="372" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', 'Arial Black', sans-serif" font-size="39" font-weight="900" letter-spacing="1" fill="url(#cyanGrad)" filter="url(#cyanGlow)">16</text>
</svg>
