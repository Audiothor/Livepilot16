<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LivePilot 16 — Live Control Cockpit</title>
  <meta name="theme-color" content="#080b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="tablet-app">
    
    <!-- 1. TOP BAR -->
    <header class="top-bar">
      <!-- Left: Single burger button & Official Logo -->
      <div class="top-left">
        <button id="btn-config" class="menu-btn" title="Paramètres & Configuration">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="brand-logo-wrap">
          <img src="logo.png" alt="LIVEPILOT 16" class="brand-logo-img">
        </div>
      </div>

      <!-- Right: Transport & Status (Clean, No Link, No duplicate gear, No Set text) -->
      <div class="top-right">
        <div id="bpm-display" class="pill-stat">120 BPM</div>
        <div id="meter-signature" class="pill-stat">4 / 4</div>
        <div id="connection-status" class="connected-status">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <circle cx="12" cy="20" r="1.5" fill="currentColor"/>
          </svg>
          Connected
        </div>
      </div>
    </header>

    <!-- 2. SCENE BANNER (HERO 3 CARDS - SYMBOLES ET TITRES UNIQUEMENT) -->
    <section class="scene-hero-grid">
      <!-- Left Card: Previous Scene -->
      <div id="scene-prev-card" class="scene-card-side">
        <div id="btn-scene-prev" class="scene-arrow">◀</div>
        <div class="scene-content">
          <div id="scene-prev-title" class="scene-title-side">01 - Intro</div>
        </div>
      </div>

      <!-- Center Card: Active Hero Scene -->
      <div id="scene-active-card" class="scene-card-active">
        <div id="scene-play-btn" class="scene-play-icon">▶</div>
        <div class="scene-active-content">
          <div id="scene-active-title" class="scene-active-title">02 - Couplet</div>
        </div>
      </div>

      <!-- Right Card: Next Scene -->
      <div id="scene-next-card" class="scene-card-side">
        <div class="scene-content">
          <div id="scene-next-title" class="scene-title-side">03 - Refrain</div>
        </div>
        <div id="btn-scene-next" class="scene-arrow">▶</div>
      </div>
    </section>

    <!-- 3. MAIN WORKSPACE -->
    <div class="workspace-split">
      <!-- LEFT COLUMN (TRACKS + 24 KNOBS) -->
      <div class="left-column">
        
        <!-- PISTES (16 TRACKS) -->
        <div class="deck-panel" style="flex: 1.15; min-height: 0;">
          <div class="deck-header">
            <div class="deck-title-group">
              <svg class="deck-icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
              </svg>
              <span id="tracks-deck-title">PISTES (Banque 1/4 : Pistes 1 - 16)</span>
              <span id="tracks-current-focus-badge" class="current-focus-badge">— Piste #02 : Bass</span>
            </div>
            <div class="bank-nav-group">
              <button id="btn-bank-prev" class="bank-arrow-btn">◀</button>
              <div id="bank-indicator" class="bank-pill">Banque 1 / 4</div>
              <button id="btn-bank-next" class="bank-arrow-btn">▶</button>
            </div>
          </div>

          <!-- 16 TRACKS GRID -->
          <div class="tracks-grid" id="tracks-container">
            <!-- Dynamically populated by app.js -->
          </div>
        </div>

        <!-- 24 KNOBS PANEL WITH NEW STREAMLINED HEADER -->
        <div class="deck-panel knobs-panel">
          <div class="deck-header">
            <div class="deck-title-group">
              <svg class="deck-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"/>
                <circle cx="12" cy="12" r="3"/>
                <line x1="12" y1="3" x2="12" y2="7"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
                <line x1="3" y1="12" x2="7" y2="12"/>
                <line x1="17" y1="12" x2="21" y2="12"/>
              </svg>
              <span id="plugin-deck-title">PLUGIN &nbsp;—&nbsp; [2/5] Serum</span>
            </div>
          </div>

          <!-- 24 KNOBS GRID -->
          <div class="knobs-grid" id="knobs-container">
            <!-- Dynamically populated by app.js -->
          </div>
        </div>

      </div>

      <!-- RIGHT SIDEBAR (~26%) -->
      <aside class="right-sidebar">
        
        <!-- PISTE SÉLECTIONNÉE -->
        <div class="track-info-card">
          <div class="sidebar-title">PISTE SÉLECTIONNÉE</div>
          <div class="track-hero-row">
            <div class="track-hero-accent-bar" id="sel-accent-bar"></div>
            <div class="track-hero-name" id="sel-track-name">02 - Bass</div>
          </div>
          <div class="track-nav-actions">
            <button id="btn-track-prev" class="track-nav-btn">◀ Piste précédente</button>
            <button id="btn-track-next" class="track-nav-btn">Piste suivante ▶</button>
          </div>
        </div>

        <!-- DEVICES / PLUGINS -->
        <div class="device-card">
          <div class="sidebar-title">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="4" y="4" width="16" height="16" rx="3"/>
              <rect x="8" y="8" width="8" height="8" rx="1.5"/>
              <line x1="9" y1="1" x2="9" y2="4"/>
              <line x1="15" y1="1" x2="15" y2="4"/>
              <line x1="9" y1="20" x2="9" y2="23"/>
              <line x1="15" y1="20" x2="15" y2="23"/>
              <line x1="1" y1="9" x2="4" y2="9"/>
              <line x1="1" y1="15" x2="4" y2="15"/>
              <line x1="20" y1="9" x2="23" y2="9"/>
              <line x1="20" y1="15" x2="23" y2="15"/>
            </svg>
            DEVICES / PLUGINS
          </div>

          <!-- RECTANGLES DE HAUT EN BAS (PLUGINS DE LA PISTE ACTUELLE) -->
          <div id="devices-list-container" class="devices-list">
            <!-- Dynamically populated by app.js -->
          </div>

          <!-- BOUTONS PRÉCÉDENT / SUIVANT -->
          <div class="devices-nav-actions">
            <button id="btn-device-prev" class="device-nav-btn">◀ Précédent</button>
            <button id="btn-device-next" class="device-nav-btn">Suivant ▶</button>
          </div>
        </div>

        <!-- ABLETON MASTER VU-METER DESIGN (CALIBRÉ AVEC REPÈRE 0 dB ET POSITION FADER) -->
        <div class="master-hud-panel">
          <div class="master-header-row">
            <div class="master-title">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
              MASTER OUTPUT
            </div>
            <div id="master-db-readout" class="master-db-tag"><span class="main-prefix">MAIN : </span>-0.2 dB</div>
          </div>

          <div class="master-meter-box">
            <!-- Échelle de graduation supérieure alignée dB -->
            <div class="master-scale-ruler">
              <span class="m-tick-label" style="left: 0%;">−∞</span>
              <span class="m-tick-label" style="left: 28%;">−24</span>
              <span class="m-tick-label" style="left: 54%;">−12</span>
              <span class="m-tick-label" style="left: 72%;">−6</span>
              <span class="m-tick-label m-tick-label-zero" style="left: 85%;">0 dB</span>
              <span class="m-tick-label m-tick-label-clip" style="left: 98%;">+6</span>
            </div>

            <div class="master-channel-strip">
              <span class="master-ch-label">L</span>
              <div class="master-led-ladder-track">
                <div id="master-meter-l" class="master-led-gradient-bar" style="width: 80%;"></div>
                <!-- Repère fixe 0 dB nominal (Jaune vif avec lueur) -->
                <div class="master-zero-ref-line" style="left: 85%;" title="0 dB Nominal"></div>
                <!-- Curseur dynamique de position Fader Master (-0.2 dB en Cyan vif) -->
                <div id="master-fader-marker-l" class="master-fader-pos-marker" style="left: 82.5%;" title="Fader Master: -0.2 dB"></div>
              </div>
            </div>

            <div class="master-channel-strip">
              <span class="master-ch-label">R</span>
              <div class="master-led-ladder-track">
                <div id="master-meter-r" class="master-led-gradient-bar" style="width: 78%;"></div>
                <!-- Repère fixe 0 dB nominal (Jaune vif avec lueur) -->
                <div class="master-zero-ref-line" style="left: 85%;" title="0 dB Nominal"></div>
                <!-- Curseur dynamique de position Fader Master (-0.2 dB en Cyan vif) -->
                <div id="master-fader-marker-r" class="master-fader-pos-marker" style="left: 82.5%;" title="Fader Master: -0.2 dB"></div>
              </div>
            </div>

            <!-- Légende pour situer instantanément la valeur par rapport au 0 dB -->
            <div class="master-hud-legend">
              <div class="m-legend-item">
                <span class="m-legend-line zero-line-sample"></span>
                <span>0 dB (Nominal)</span>
              </div>
              <div class="m-legend-item">
                <span class="m-legend-line fader-line-sample"></span>
                <span id="master-fader-legend-txt">Fader : -0.2 dB</span>
              </div>
            </div>
          </div>
        </div>

      </aside>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
