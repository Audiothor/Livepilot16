<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LivePilot Cockpit — Stage HUD</title>
  <meta name="theme-color" content="#0a0b0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cockpit-container">
    <!-- TOP BAR : Transport & Live Master Info -->
    <header id="top-bar">
      <div class="top-left">
        <div id="connection-status" class="status-badge disconnected">
          <span class="status-dot"></span>
          <span id="status-text">OFFLINE</span>
        </div>
        <div class="brand-title">
          LIVEPILOT <span class="brand-accent">COCKPIT</span>
        </div>
      </div>

      <!-- BANDEAU SCÈNE EN COURS SUR 2 LIGNES EN LONGUEUR -->
      <div id="active-scene-banner" class="scene-banner">
        <div class="scene-line-1">
          <span id="scene-num-badge" class="scene-num-tag">SCÈNE #--</span>
          <span id="scene-name" class="scene-title">AUCUNE SCÈNE</span>
        </div>
        <div id="scene-desc" class="scene-line-2">
          Chargement du projet Ableton Live...
        </div>
      </div>

      <div class="top-right">
        <!-- POSITION / MESURE -->
        <div class="metric-box">
          <div class="metric-label">MESURE</div>
          <div id="position-counter" class="metric-value">1.1.1</div>
        </div>

        <!-- TEMPO -->
        <div class="metric-box tempo-box">
          <div class="metric-label">TEMPO</div>
          <div class="tempo-control">
            <button id="btn-tempo-down" class="btn-micro">-</button>
            <span id="tempo-display" class="metric-value">120.0</span>
            <span class="metric-unit">BPM</span>
            <button id="btn-tempo-up" class="btn-micro">+</button>
          </div>
        </div>

        <!-- PLAY / STOP / PAUSE STATUS BADGE -->
        <div class="transport-group">
          <div id="play-status-badge" class="status-state-badge stop">
            <span id="play-status-icon">⏹</span>
            <span id="play-status-text">STOP</span>
          </div>
          <button id="btn-play" class="btn-transport play" title="Play / Pause / Stop">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <polygon points="6,4 20,12 6,20"/>
            </svg>
          </button>
        </div>

        <!-- FULLSCREEN -->
        <button id="btn-fullscreen" class="btn-icon" title="Plein écran">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- SECTION MIXER (2 RANGÉES DE 8 PISTES — COPIE CONFORME DU LAUNCH CONTROL XL) -->
    <section id="mixer-section">
      <div class="section-header">
        <div class="section-title">
          <span>16-TRACK MIXER (2x8)</span>
          <span id="bank-indicator" class="bank-tag">BANQUE 1 (1-16)</span>
        </div>

        <!-- BANDEAU CENTRAL DE LA PISTE ACTUELLEMENT SÉLECTIONNÉE -->
        <div id="focused-track-banner" class="focused-track-center">
          <span class="focused-label">PISTE SÉLECTIONNÉE :</span>
          <span id="focused-track-chip" class="focused-chip">CH 1 : -</span>
          <span id="focused-track-vol" class="focused-vol">-inf dB</span>
        </div>

        <div class="bank-controls">
          <button id="btn-bank-prev" class="btn-action">◄ BANK</button>
          <button id="btn-bank-next" class="btn-action">BANK ►</button>
          <button id="btn-toggle-scenes" class="btn-action btn-scenes-toggle">SCÈNES</button>
        </div>
      </div>

      <!-- DISPOSITION PHYSIQUE 2x8 IDENTIQUE AUX 16 BOUTONS DU LAUNCH CONTROL XL -->
      <div id="tracks-strip-container" class="tracks-2x8-deck">
        <!-- Rangée Haute : Boutons 1 à 8 -->
        <div id="tracks-row-1" class="tracks-row-grid"></div>
        <!-- Rangée Basse : Boutons 9 à 16 -->
        <div id="tracks-row-2" class="tracks-row-grid"></div>
      </div>
    </section>

    <!-- SECTION DEVICE & 24 POTENTIOMÈTRES (3 RANGÉES DE 8 — SANS PERTE DE PLACE) -->
    <section id="device-section">
      <div class="device-header">
        <div class="device-track-info">
          <span class="device-sublabel">PLUGIN ACTIF :</span>
          <span id="active-device-title" class="active-device-badge">[1/1] No Assignment</span>
        </div>

        <!-- Chaîne complète des plugins sur la piste -->
        <div id="device-chain-bar" class="device-chain-scroll"></div>

        <div class="device-nav-buttons">
          <button id="btn-device-prev" class="btn-action">◄ DEV</button>
          <button id="btn-device-next" class="btn-action">DEV ►</button>
        </div>
      </div>

      <!-- MATRICE ÉPURÉE DES 24 PARAMÈTRES (3 RANGÉES DE 8 SANS BANDEAUX SUPERFLUS) -->
      <div class="knobs-wrapper-compact">
        <div id="knobs-row-1" class="knobs-grid row-1"></div>
        <div id="knobs-row-2" class="knobs-grid row-2"></div>
        <div id="knobs-row-3" class="knobs-grid row-3"></div>
      </div>
    </section>

    <!-- MODAL / DRAWER LATÉRAL DES SCÈNES -->
    <div id="scenes-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>ABLETON LIVE — LISTE DES SCÈNES</h3>
          <button id="btn-close-scenes" class="btn-close">&times;</button>
        </div>
        <div id="scenes-list" class="scenes-grid"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
