<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LivePilot Cockpit — Stage HUD</title>
  <meta name="theme-color" content="#0a0b0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cockpit-container">
    <!-- TOP BAR : Transport & Live Master Info -->
    <header id="top-bar">
      <div class="top-left">
        <div id="connection-status" class="status-badge disconnected">
          <span class="status-dot"></span>
          <span id="status-text">OFFLINE</span>
        </div>
        <div class="brand-title">
          LIVEPILOT <span class="brand-accent">COCKPIT</span>
        </div>
      </div>

      <!-- BANDEAU SCÈNE EN COURS (Haute visibilité pour le Live) -->
      <div id="active-scene-banner" class="scene-banner">
        <div class="scene-label">ACTIVE SCENE</div>
        <div id="scene-name" class="scene-title">NO SCENE</div>
      </div>

      <div class="top-right">
        <!-- BAR / BEAT COUNTER -->
        <div class="metric-box">
          <div class="metric-label">POSITION</div>
          <div id="position-counter" class="metric-value">1.1.1</div>
        </div>

        <!-- TEMPO & TRANSPORT -->
        <div class="metric-box tempo-box">
          <div class="metric-label">TEMPO</div>
          <div class="tempo-control">
            <button id="btn-tempo-down" class="btn-micro">-</button>
            <span id="tempo-display" class="metric-value">120.0</span>
            <span class="metric-unit">BPM</span>
            <button id="btn-tempo-up" class="btn-micro">+</button>
          </div>
        </div>

        <div class="transport-buttons">
          <button id="btn-play" class="btn-transport play" title="Play / Stop">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <polygon points="6,4 20,12 6,20" fill="currentColor"/>
            </svg>
          </button>
        </div>

        <!-- FULLSCREEN & SCREEN WAKE LOCK -->
        <button id="btn-fullscreen" class="btn-icon" title="Plein écran">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- SECTION MIXER (8 PISTES ALIGNÉES SUR LAUNCH CONTROL XL & LAUNCHPAD) -->
    <section id="mixer-section">
      <div class="section-header">
        <div class="section-title">
          <span>8-TRACK MIXER</span>
          <span id="bank-indicator" class="bank-tag">BANK 1 / 1</span>
        </div>
        <div class="bank-controls">
          <button id="btn-bank-prev" class="btn-action">◄ BANK</button>
          <button id="btn-bank-next" class="btn-action">BANK ►</button>
          <button id="btn-toggle-scenes" class="btn-action btn-scenes-toggle">SCENES LIST</button>
        </div>
      </div>

      <div id="tracks-strip-container" class="tracks-grid">
        <!-- Généré dynamiquement en JS (8 pistes) -->
      </div>
    </section>

    <!-- SECTION DEVICE & 24 ENCODEURS (ALIGNÉS SUR LES 24 KNOBS LAUNCH CONTROL XL) -->
    <section id="device-section">
      <div class="device-header">
        <div class="device-track-info">
          <span class="device-sublabel">SELECTED TRACK :</span>
          <span id="active-track-name" class="active-track-title">-</span>
        </div>

        <!-- Chaîne des plugins sur la piste -->
        <div id="device-chain-bar" class="device-chain-scroll">
          <!-- Injecté dynamiquement (ex: [Operator] [AutoFilter]* [Echo]) -->
        </div>

        <div class="device-nav-buttons">
          <button id="btn-device-prev" class="btn-action">◄ DEV</button>
          <button id="btn-device-next" class="btn-action">DEV ►</button>
        </div>
      </div>

      <!-- MATRICE DES 24 PARAMÈTRES (3 RANGÉES DE 8 KNOBS) -->
      <div class="knobs-wrapper">
        <div class="knobs-row-label">ROW 1 (KNOBS 1-8)</div>
        <div id="knobs-row-1" class="knobs-grid row-1"></div>

        <div class="knobs-row-label">ROW 2 (KNOBS 9-16)</div>
        <div id="knobs-row-2" class="knobs-grid row-2"></div>

        <div class="knobs-row-label">ROW 3 (KNOBS 17-24)</div>
        <div id="knobs-row-3" class="knobs-grid row-3"></div>
      </div>
    </section>

    <!-- MODAL / DRAWER LATÉRAL DES SCÈNES -->
    <div id="scenes-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>ABLETON LIVE SCENES</h3>
          <button id="btn-close-scenes" class="btn-close">&times;</button>
        </div>
        <div id="scenes-list" class="scenes-grid">
          <!-- Injecté dynamiquement -->
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
