; PlatformIO Project Configuration File for LivePilot 16
; Microcontrôleur : ESP32-S3 DevKitC-1 N16R8 (16MB Flash, 8MB PSRAM)

[platformio]
default_envs = esp32s3_livepilot

[env:esp32s3_livepilot]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Configuration CPU et mémoire
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi

; Options de compilation : Support USB natif OTG + TinyUSB MIDI
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CFG_TUD_MIDI=1
    -D CORE_DEBUG_LEVEL=3
    -I include

; Dépendances logicielles (toutes gratuites et open-source)
lib_deps = 
    lovyan03/LovyanGFX @ ^1.1.12
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    adafruit/Adafruit NeoPixel @ ^1.12.0
    fortyseveneffects/MIDI Library @ ^5.0.2

monitor_speed = 115200
upload_speed = 921600
